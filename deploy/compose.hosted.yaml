# Hosted God's Eye View: the app plus Caddy for TLS and named logins.
#
#   docker compose -f deploy/compose.hosted.yaml up -d --build
#
# Run it from the repository root so the relative paths resolve. Everything
# site-specific lives in deploy/.env (copy deploy/.env.example).
#
# Only Caddy publishes ports. The app is reachable on the compose network at
# app:4173 and never on the host, so the only way in is through the login.
#
# Pinned, so the volume names do not change if this folder is renamed:
# caddy's certificate lives in gev-hosted_caddy_data (see RUNBOOK.md, backups).
name: gev-hosted

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The app refuses a Host it does not know. Caddy forwards the public name,
      # so the public name has to be on the list (build/allowedHosts.js).
      GEV_ALLOWED_HOSTS: ${DOMAIN}
      # Provider Settings is for the machine that owns the keys. On a hosted
      # instance that is nobody at the other end of the internet, so no peer is
      # trusted and keys are set in .env on the server instead.
      GEV_KEY_SETUP_TRUSTED_PEERS: none
    volumes:
      # The app keeps keys and its on-disk cache beside the code, and its
      # Dockerfile serves the checkout directly, so the repository is the state.
      - ..:/app:z
      # Sharp and friends are built for Linux inside the image; do not let the
      # host's node_modules shadow them.
      - /app/node_modules
    expose:
      - '4173'
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173/').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Where Caddy forwards requests. Overridable so the same file can be run
      # against a local server (see RUNBOOK.md).
      APP_UPSTREAM: ${APP_UPSTREAM:-app:4173}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The only list of who may log in. Generated by make-users.mjs.
      - ./users.caddyfile:/etc/caddy/users.caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  # Certificates and ACME account keys. Losing this volume only means Caddy
  # asks for a new certificate, which counts against Let's Encrypt rate limits.
  caddy_data:
  caddy_config:
